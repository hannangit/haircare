<div class="modal-bg" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title" hidden>
  <div class="modal" role="document">
    <div class="modal-hd">
      <div>
        <h3 id="m-title">Book an appointment</h3>
        <div class="psub" id="m-sub"></div>
      </div>
      <button type="button" class="x" id="m-close" aria-label="Close">&#10005;</button>
    </div>
    <div class="modal-bd">
      <!-- No form, no form backend. Two ways through: message us, or pick a
           slot. Both are configured in config.js, so a new site changes the
           number and the booking link and nothing else. -->
      <p class="booking-notice" id="m-notice"></p>
      <div class="action-grid">
        <a class="btn btn-gold u-full" id="m-whatsapp" href="#" target="_blank" rel="noopener">
          <span data-icon="whatsapp" data-icon-size="18"></span> Message us on WhatsApp
        </a>
        <button class="btn btn-outline u-full" type="button" id="m-book">
          <span data-icon="calendar" data-icon-size="18"></span> See available slots
        </button>
      </div>
      <p class="note" id="m-note"></p>
    </div>
  </div>
</div>
